<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">UAX Studio</title>
  <desc id="description">Turn product ideas and source notes into AI-ready build briefs.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080808"/>
      <stop offset="0.55" stop-color="#111513"/>
      <stop offset="1" stop-color="#0c0c0c"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="30%" r="70%">
      <stop offset="0" stop-color="#68e0ad" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#68e0ad" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" rx="28" fill="url(#background)"/>
  <rect width="1280" height="640" rx="28" fill="url(#glow)"/>
  <rect width="1280" height="640" rx="28" fill="url(#grid)"/>
  <rect x="1.5" y="1.5" width="1277" height="637" rx="26.5" fill="none" stroke="#2b2b2b" stroke-width="3"/>

  <g transform="translate(86 84)">
    <rect width="92" height="92" rx="16" fill="#121212" stroke="#68e0ad" stroke-width="4"/>
    <text x="46" y="58" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="800" fill="#68e0ad">UAX</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="86" y="242" fill="#f5f5f5" font-size="72" font-weight="800" letter-spacing="-2">UAX Studio</text>
    <text x="86" y="302" fill="#d5d5d5" font-size="31" font-weight="400">Turn product ideas into AI-ready build briefs.</text>
    <text x="86" y="350" fill="#a3a3a3" font-size="23">Local-first · Editable · No API key required</text>

    <g transform="translate(86 438)" font-size="19" font-weight="700">
      <rect width="152" height="48" rx="8" fill="#68e0ad" fill-opacity="0.14" stroke="#68e0ad" stroke-opacity="0.55"/>
      <text x="76" y="31" text-anchor="middle" fill="#68e0ad">BUILD CONTRACT</text>

      <rect x="172" width="124" height="48" rx="8" fill="#181818" stroke="#414141"/>
      <text x="234" y="31" text-anchor="middle" fill="#d5d5d5">WORKFLOW</text>

      <rect x="316" width="106" height="48" rx="8" fill="#181818" stroke="#414141"/>
      <text x="369" y="31" text-anchor="middle" fill="#d5d5d5">REVIEWS</text>

      <rect x="442" width="104" height="48" rx="8" fill="#181818" stroke="#414141"/>
      <text x="494" y="31" text-anchor="middle" fill="#d5d5d5">EXPORT</text>
    </g>

    <text x="86" y="566" fill="#7d7d7d" font-size="19">Python · Flask · SQLite · Ollama optional</text>
  </g>

  <g transform="translate(865 112)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect width="296" height="368" rx="18" fill="#121212" stroke="#2b2b2b" stroke-width="3"/>
    <rect x="26" y="28" width="244" height="38" rx="7" fill="#181818" stroke="#414141"/>
    <circle cx="48" cy="47" r="6" fill="#68e0ad" stroke="none"/>
    <path d="M70 47h96" stroke="#d5d5d5" stroke-width="8"/>
    <path d="M190 47h54" stroke="#7d7d7d" stroke-width="8"/>

    <rect x="26" y="94" width="106" height="78" rx="9" fill="#181818" stroke="#414141"/>
    <path d="M47 121h54M47 145h34" stroke="#a3a3a3" stroke-width="7"/>

    <rect x="164" y="94" width="106" height="78" rx="9" fill="#181818" stroke="#414141"/>
    <path d="M185 121h54M185 145h42" stroke="#a3a3a3" stroke-width="7"/>

    <path d="M79 202v35h138v35" stroke="#68e0ad" stroke-opacity="0.8" stroke-width="4"/>
    <circle cx="79" cy="202" r="10" fill="#121212" stroke="#68e0ad" stroke-width="4"/>
    <circle cx="217" cy="272" r="10" fill="#121212" stroke="#68e0ad" stroke-width="4"/>

    <rect x="26" y="300" width="244" height="38" rx="7" fill="#68e0ad" fill-opacity="0.13" stroke="#68e0ad" stroke-opacity="0.65"/>
    <path d="M49 319h142" stroke="#68e0ad" stroke-width="7"/>
    <path d="M218 319h27" stroke="#68e0ad" stroke-width="7"/>
  </g>
</svg>
